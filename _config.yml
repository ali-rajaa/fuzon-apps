title: Fuzon Apps
description: Fuzon Apps makes Android apps for everyday jobs, free to download on Google Play.

# ---------------------------------------------------------------------------
# Site address. Two states; see STATUS.md section 7.
#
#   Preview          url: "https://fuzon.fixmypcperth.com"  baseurl: ""  staging: true
#   Live             url: "https://fuzonapps.com"           baseurl: ""  staging: false
#
# This file keeps the preview values: pages.yml deploys them to GitHub
# Pages (fuzon.fixmypcperth.com, noindex). The live site, fuzonapps.com,
# is on the owner's web host and uploaded by ftp.yml, which writes a
# second config at build time with the live url and staging: false
# (owner, 18 Oct; STATUS.md section 8).
#
# Every internal link goes through relative_url and every full URL through
# absolute_url, and both read these values, so the switch is these three
# lines and nothing else. The custom domain itself is set in the repo's
# Settings > Pages > Custom domain: Actions deployments ignore a CNAME file.
# ---------------------------------------------------------------------------
url: "https://fuzon.fixmypcperth.com"
baseurl: ""

# true adds noindex to every page and blocks crawling in robots.txt, so the
# preview can never be indexed. Set to false only at the cutover.
staging: true

timezone: Australia/Perth

plugins: []

# Stylesheets are written as plain CSS in .scss files (assets/css/) so
# Jekyll's built-in Sass compiles them to minified .css at build time.
# The source keeps every comment; the served file has none.
sass:
  style: compressed
  sourcemap: never

# Fail the build on a Liquid or front matter mistake instead of shipping a
# page with the mistake rendered into it. strict_variables stays off on
# purpose: optional front matter (css, tone, noindex) is read as unset.
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true

# The company behind the apps. legal_name is written exactly as the owner's
# Privacy Policy and Terms of Service write it ("FUZON APS PTY LIMITED"),
# still to be confirmed against ASIC (STATUS.md section 10). It appears on
# the legal pages only; the rest of the site says Fuzon Apps.
# support_email is the owner's choice (16 Oct) and is used site-wide.
company:
  legal_name: "FUZON APS PTY LIMITED"
  support_email: "console@fuzonapps.com"

# Fuzon Apps' developer page on Google Play (owner, 16 Oct): every app in
# one place. Linked as "All our apps on Google Play" and used as sameAs in
# the Organization schema.
play_developer_url: "https://play.google.com/store/apps/dev?id=8522805663199379420"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - STATUS.md
  - PLAN.md
  - SITE-PLAYBOOK.md
  - _reference
  - .github
  - .claude
  - vendor
  - node_modules
