title: Fuzon Apps
description: Fuzon Apps makes apps for everyday jobs on Android and iPhone, free to download on Google Play and the App Store.

# ---------------------------------------------------------------------------
# Site address: the live site, fuzonapps.com, on the owner's web host.
# Every push to main is built and uploaded by .github/workflows/ftp.yml
# (owner, 18 Oct: "always push to main website"). The GitHub Pages
# preview (fuzon.fixmypcperth.com) was retired the same day.
#
# Every internal link goes through relative_url and every full URL through
# absolute_url, and both read these values.
# ---------------------------------------------------------------------------
url: "https://fuzonapps.com"
baseurl: ""

# true would add noindex to every page and block crawling in robots.txt
# (the old preview). The live site is indexable; pages that aren't ready
# (the guides while they're drafts) carry their own noindex.
staging: false

timezone: Australia/Perth

plugins: []

# Stylesheets are written as plain CSS in .scss files (assets/css/) so
# Jekyll's built-in Sass compiles them to minified .css at build time.
# The source keeps every comment; the served file has none.
sass:
  style: compressed
  sourcemap: never

# Fail the build on a Liquid or front matter mistake instead of shipping a
# page with the mistake rendered into it. strict_variables stays off on
# purpose: optional front matter (css, tone, noindex) is read as unset.
strict_front_matter: true
liquid:
  error_mode: strict
  strict_filters: true

# The company behind the apps. legal_name is written exactly as the owner's
# Privacy Policy and Terms of Service write it ("FUZON APS PTY LIMITED"),
# still to be confirmed against ASIC (STATUS.md section 10). It appears on
# the legal pages only; the rest of the site says Fuzon Apps.
# support_email is the owner's choice (16 Oct) and is used site-wide.
company:
  legal_name: "FUZON APS PTY LIMITED"
  support_email: "console@fuzonapps.com"

# Fuzon Apps' developer page on Google Play (owner, 16 Oct): every app in
# one place. Linked as "All our apps on Google Play" and used as sameAs in
# the Organization schema.
play_developer_url: "https://play.google.com/store/apps/dev?id=8522805663199379420"

# Fuzon Apps' developer page on the App Store (owner, 26 Oct). The owner's
# link had a Macau storefront and language in it (/mo/, ?l=en-GB); without
# them Apple opens the visitor's own country's store. Linked beside every
# Google Play developer link and used as sameAs.
appstore_developer_url: "https://apps.apple.com/developer/fuzon-aps-pty-limited/id1868315941"

# Sign in to Cloud Storage on the web (owner, 26 Oct). The header's button
# ("Sign in", replacing "Get the apps"), the Cloud Storage page and the
# delete-account page link here.
cloud_signin_url: "https://cloud.fuzonapps.com/signin"

# Google Ads tag (owner, 26 Oct: "conversion value fixing"). Loaded on
# every page of the live site by _includes/google-tag.html; never when
# staging is true. Empty turns it off.
google_ads_id: "AW-18507925058"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - STATUS.md
  - PLAN.md
  - SITE-PLAYBOOK.md
  - _reference
  - .github
  - .claude
  - vendor
  - node_modules
