# One entry per app. The header menu, homepage showcase and cards, the CTA
# band, the footer, the 404 page and the homepage schema all read this
# list, so an app's name or link is typed once.
#
# Copy comes from the Google Play listings (owner's screenshots, 16 Oct:
# titles, the "Contains ads / In-app purchases" labels and the screenshot
# captions). Legal-document wording stays on the legal pages only (owner,
# 16 Oct). Never add ratings, review counts or download numbers (owner).
#
#   name        name used on the site
#   short       short name for menus and buttons
#   store_name  title on Google Play. Shown beside the store button only
#               when it differs from `name` (Smart Switch: owner, 16 Oct,
#               keep "Smart Switch", it's also our name)
#   slug        page address (/<slug>)
#   tone        colour identity from the logo (shell.scss "App tones")
#   glyph       icon-sprite symbol drawn on the app's tile
#   tagline     one line on what the app does
#   points      three things it does (showcase, cards, placeholder page)
#   android_url Google Play listing. Store buttons and "Android" are derived
#               from these, never typed.
#   ios_url     App Store listing (none yet)
#   ads         true if the listing says "Contains ads" (app-ads.txt)
#   built       true once the app's full page exists; until then its
#               address serves the "upcoming" placeholder

- name: "Cloud Storage & Cloud Drive"
  short: "Cloud Storage"
  store_name: "Cloud Storage & Cloud Drive"
  slug: "cloud-storage"
  tone: "cloud"
  glyph: "cloud"
  tagline: "Store your files and photos in the cloud, keep them organised and share them when you need to."
  points:
    - "Store files and photos in the cloud"
    - "Keep your files organised in folders"
    - "Share files with other people"
  android_url: "https://play.google.com/store/apps/details?id=com.cloudstorageapp.cloudbackup.storagespace.databackup"
  ios_url: ""
  ads: false
  built: false

- name: "Smart Switch"
  short: "Smart Switch"
  store_name: "Transfer My Data – Phone Clone"
  slug: "smart-switch"
  tone: "switch"
  glyph: "transfer"
  tagline: "Move your data from your old phone to your new one. Clone the whole phone, or transfer just the files you pick."
  points:
    - "Clone your old phone to your new one"
    - "Transfer just the files you choose"
    - "Old Android to new Android"
  android_url: "https://play.google.com/store/apps/details?id=com.smartswitch.shareit.datashare.phoneclone"
  ios_url: ""
  ads: true
  built: false

- name: "GPS Navigation & Directions"
  short: "GPS Navigation"
  store_name: "GPS Navigation & Directions"
  slug: "gps-navigation"
  tone: "gps"
  glyph: "navigation"
  tagline: "Live GPS navigation and directions: plan the best route and see speed cameras and real-time traffic."
  points:
    - "Live GPS navigation and directions"
    - "Plan the best route to your destination"
    - "Speed cameras and real-time traffic"
  android_url: "https://play.google.com/store/apps/details?id=com.gpsnavigation.directions.gpsmaps"
  ios_url: ""
  ads: true
  built: false
